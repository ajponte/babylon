version: '3.8'

services:
  # The OpenBao service, which your application can use for secrets management.
  openbao:
    image: openbao/openbao:latest
    container_name: openbao
    restart: unless-stopped
    cap_add:
      - IPC_LOCK # Required by OpenBao to prevent memory from being swapped to disk.
    ports:
      - "8200:8200" # Exposes the OpenBao API port.
    volumes:
      - openbao_data:/openbao/data # Persists the OpenBao data.
    environment:
      # This tells OpenBao to run in "dev" mode, which is great for local development.
      # It automatically initializes the server and provides a root token.
      - BAO_DEV_ROOT_TOKEN_ID=dev-token
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - BAO_LOG_LEVEL=info

  # PostgreSQL database service.
  postgres:
    image: postgres:15-alpine # Use a lightweight, stable PostgreSQL image.
    container_name: postgres
    restart: unless-stopped
    ports:
      # Use an environment variable for the host port.
      - "${BABYLON_DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists the database data.
    environment:
      # These environment variables are required to set up the database.
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=babylon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d babylon"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB vector store service.
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    ports:
      - "8003:8000" # Exposes the ChromaDB API port on a less common host port.
    volumes:
      - chroma_data:/chroma/data # Persists the ChromaDB data.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Your Gunicorn application service.
  babylon-app:
    image: babylon-app:latest # Make sure you have this image built locally.
    container_name: babylon-app
    restart: unless-stopped
    ports:
      - "5001:8000" # Maps host port 5001 to the container's port 8000.
    depends_on:
      openbao:
        condition: service_started
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy # Ensure ChromaDB is healthy before starting the app.
    environment:
      # These environment variables link your app to the OpenBao container.
      # The hostname `openbao` is automatically resolved by Docker Compose.
      - BAO_ADDR=http://openbao:8200
      - BAO_TOKEN=dev-token
      # Environment variables for connecting to the PostgreSQL database.
      # The port here must always be 5432 for internal Docker networking.
      - DATABASE_URL=postgresql://user:password@postgres:5432/babylon
      # Environment variables for connecting to the ChromaDB service.
      - CHROMA_API_ENDPOINT=http://chroma:8000
      # Your application's other environment variables go here
      # For example:
      # - FLASK_SECRET_KEY=...

# Define volumes for persistent data.
volumes:
  openbao_data:
  postgres_data:
  chroma_data: # Define the new volume for ChromaDB.