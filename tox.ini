# tox.ini
# This configuration shows how to use tox with a Poetry-managed project
# by letting tox manage the environment.
[tox]
min_version = 4.0
env_list = py313, download-spec, pytest, lint, format, typecheck, dist

# ---
# This is the base configuration for all test environments.
[testenv]
description = Setup tox project
# Tox will automatically use the pyproject.toml build backend (poetry)
# to install the package in an isolated way.
isolated_build = True
# This is the key change. We tell tox to install the project itself.
# This makes all the dependencies from pyproject.toml available to the env.
deps =
    -e .

# ---
# This section defines the specific environment for Python 3.13 testing.
[testenv:py313]
# Use the Python 3.13 interpreter.
base_python = python3.13

[testenv:pytest]
description = Run pytests for the project
deps =
    pytest
commands =
    pytest tests
# This is the fix: we explicitly allow the `pytest` command to run.
allowlist_externals =
    pytest

[testenv:lint]
description = run linter
deps =
    pylint
commands =
    pylint --rc-file=.pylintrc server/
allowlist_externals =
    pylint

[testenv:format]
description = format with black
deps =
    black
commands =
    black server --check --diff
allowlist_externals =
    black

[testenv:typecheck]
description = Type checking with mypy
deps =
    mypy
commands = mypy server
allowlist_externals =
    mypy

[testenv:dist]
description =
    Build a distribution via poetry.
commands =
    poetry build
allowlist_externals =
    poetry

[testenv:download-spec]
description = Download OpenAPI spec. Gets the latest by default. Set SPEC_RUN_ID to get a specific version.
deps =
    requests
commands =
    python github_artifacts.py --repo {env:BABYLON_API_REPO} --run-id "{env:SPEC_RUN_ID:}" --pat-token "{env:BABYLON_API_GITHUB_PAT_TOKEN}"
# We explicitly allow the `python` command to run.
allowlist_externals =
    python
setenv =
    BABYLON_API_REPO = ajponte/babylon_api_spec
# Pass the PAT from your local environment to tox.
# Pass SPEC_RUN_ID to specify a version.
passenv =
    BABYLON_API_GITHUB_PAT_TOKEN
    SPEC_RUN_ID
