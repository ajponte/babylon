name: babylon-server

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Download API spec artifact
      run: |
        chmod +x ./download-api-spec.sh
        ./download-api-spec.sh ajponte/babylon_api_spec 17652643510 api-spec-17652643510 "${{ secrets.BABYLON_API_PAT }}"
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        pip install poetry 
        # Install poetry dependencies only.
        poetry install
    - name: Pylint checks
      run: |
        tox -e lint
    - name: Formatting checks
      run: |
        tox -e format
    - name: Pytest
      run: |
        tox -e pytest
