name: babylon-server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Download API spec artifact
      uses: actions/download-artifact@v4
      with:
        # Manually update the artifact name with the desired run ID
        name: api-spec-17652643510
        path: ./api-specs
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Manually update the run-id to match the artifact version
        run-id: 17652643510
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        pip install poetry 
        # Install poetry dependencies only.
        poetry install
    - name: Pylint checks
      run: |
        tox -e lint
    - name: Formatting checks
      run: |
        tox -e format
    - name: Pytest
      run: |
        tox -e pytest
